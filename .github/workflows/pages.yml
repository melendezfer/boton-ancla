# Publica la demo en GitHub Pages: https://melendezfer.github.io/boton-ancla/
# Sitio estático (sin servidor): las métricas se quedan en el celular de cada persona.
# Corre en cada push a main (y a mano desde la pestaña Actions). Antes de publicar,
# pasan las pruebas del núcleo y de la demo, los tipos y el lint; las E2E (Playwright)
# se corren en local antes de cada commit.

name: Publicar la demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una publicación a la vez; si llega otra, la anterior se cancela.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas (Vitest)
        run: npm test
      - name: Tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint -w apps/demo
      - name: Exportación estática
        run: npm run build -w apps/demo
        env:
          EXPORTAR_PAGES: "1"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/demo/.next-pages

  publicar:
    needs: compilar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - id: publicacion
        uses: actions/deploy-pages@v4
